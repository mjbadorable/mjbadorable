<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Marvin Jhay Adorable — Computer Engineer & AI Systems Builder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="55%" stop-color="#0f1419" />
      <stop offset="100%" stop-color="#052e23" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="25%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Base container -->
  <rect width="1200" height="240" rx="14" fill="url(#bg)" />
  <rect width="1200" height="240" rx="14" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="238" rx="13" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Subtle top & bottom emerald glow lines -->
  <rect x="140" y="0" width="920" height="2" fill="url(#accentLine)" />
  <rect x="200" y="238" width="800" height="2" fill="url(#accentLine)" />

  <!-- Corner brackets -->
  <path d="M 28 46 L 28 28 L 46 28" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 1172 46 L 1172 28 L 1154 28" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 28 194 L 28 212 L 46 212" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 1172 194 L 1172 212 L 1154 212" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7" />

  <!-- Top status pill -->
  <rect x="435" y="42" width="330" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="454" cy="55" r="4" fill="#34D399" />
  <text x="608" y="59" text-anchor="middle" fill="#a1a1aa" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4">
    ILOILO, PH // SYSTEMS &amp; AI WORKFLOWS
  </text>

  <!-- Main Name -->
  <text x="600" y="128" text-anchor="middle" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5">
    Marvin Jhay Adorable
  </text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" fill="#34D399" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" font-weight="600" letter-spacing="0.4">
    Computer Engineer (MS CpE Candidate)  •  AI Systems &amp; EdTech Builder
  </text>

  <!-- Bottom micro-tag -->
  <text x="600" y="204" text-anchor="middle" fill="#71717a" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="0.8">
    NEXT.JS 16  ·  TYPESCRIPT  ·  CONVEX  ·  CLAUDE API  ·  ACTIVEPIECES  ·  EDTECH OPS
  </text>
</svg>
